<nav class="sticky top-0 z-50 border-b border-slate-100 bg-white/80 shadow-sm backdrop-blur-md dark:border-slate-800 dark:bg-mayfair-dark/80">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-3">
    <a routerLink="/" class="flex items-center gap-3 transition-transform hover:scale-105">
      <img src="/media/only_logo.png" alt="MayfairTech Logo" class="h-12 w-auto md:h-14" />
      <span class="flex flex-col leading-tight">
        <span class="font-serif text-lg font-bold text-mayfair-navy md:text-xl dark:text-white">MayfairTech</span>
        <span class="text-[11px] font-semibold tracking-wide text-mayfair-teal uppercase">Expert Solutions</span>
      </span>
    </a>

    <div class="hidden items-center gap-9 font-serif font-medium text-mayfair-navy md:flex dark:text-slate-100">
      @for (link of links(); track link.path + (link.fragment ?? '')) {
        <a
          [routerLink]="link.path"
          [fragment]="link.fragment"
          class="group relative py-1 transition hover:text-mayfair-teal"
        >
          {{ link.labelKey | translate }}
          <span
            class="absolute -bottom-0.5 left-0 h-[2px] w-0 bg-mayfair-teal transition-all duration-300 group-hover:w-full"
          ></span>
        </a>
      }

      <div class="group relative">
        <button type="button" class="flex items-center gap-1.5 py-1 transition hover:text-mayfair-teal">
          {{ 'nav_products' | translate }}
          <i class="fas fa-chevron-down text-[10px] transition-transform group-hover:rotate-180"></i>
        </button>
        <div
          class="invisible absolute left-1/2 top-full z-50 -translate-x-1/2 pt-3 opacity-0 transition-all duration-200 group-hover:visible group-hover:opacity-100"
        >
          <div class="min-w-[260px] rounded-2xl border border-slate-100 bg-white p-2 shadow-2xl dark:border-slate-700 dark:bg-mayfair-dark">
            @for (p of products; track p.slug) {
              <a
                [routerLink]="p.href"
                class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold text-mayfair-navy transition hover:bg-slate-50 dark:text-slate-100 dark:hover:bg-white/5"
              >
                <i class="fas w-4 text-mayfair-teal" [class]="p.icon"></i> {{ p.nameKey | translate }}
              </a>
            }
            <a
              routerLink="/products.html"
              class="mt-1 flex items-center gap-3 rounded-xl border-t border-slate-100 px-4 py-3 pt-3 text-sm font-bold text-mayfair-teal transition hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-white/5"
            >
              <i class="fas fa-th-large w-4"></i> {{ 'products_view_all' | translate }}
            </a>
          </div>
        </div>
      </div>

      <div class="border-l border-slate-200 pl-8 dark:border-slate-700">
        <app-language-switcher />
      </div>
    </div>

    <div class="flex items-center gap-4">
      <a
        [routerLink]="ctaPath()"
        [fragment]="ctaFragment()"
        class="hidden rounded-xl bg-mayfair-navy px-6 py-2.5 font-bold text-white transition-all hover:bg-mayfair-teal sm:block dark:bg-mayfair-teal dark:hover:bg-white dark:hover:text-mayfair-navy"
      >
        {{ ctaLabelKey() | translate }}
      </a>

      <button
        type="button"
        (click)="mobileMenu.open()"
        class="text-2xl text-mayfair-navy focus:outline-none md:hidden dark:text-slate-100"
        aria-label="Open navigation menu"
        [attr.aria-expanded]="mobileMenu.isOpen()"
        aria-controls="mobileMenu"
      >
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</nav>
