@if (submitState() === 'success') {
  <div class="animate-fade-in rounded-[2.5rem] bg-white p-12 text-center dark:bg-slate-900">
    <div class="mb-6 inline-flex h-20 w-20 items-center justify-center rounded-2xl bg-mayfair-teal/10 text-mayfair-teal shadow-sm">
      <i class="fab fa-whatsapp text-4xl"></i>
    </div>
    <h3 class="mb-4 font-serif text-3xl font-bold text-mayfair-navy dark:text-white">{{ 'form_success_title' | translate }}</h3>
    <p class="mx-auto mb-8 max-w-md text-lg leading-relaxed text-slate-600 dark:text-slate-300">{{ 'form_footer' | translate }}</p>
  </div>
} @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6 rounded-[2.5rem] bg-white p-10 dark:bg-slate-900">
    <div class="grid gap-6 md:grid-cols-2">
      <div>
        <label class="mb-2 block text-sm font-bold tracking-tight text-mayfair-navy uppercase dark:text-slate-200">{{ 'form_name' | translate }}</label>
        <input type="text" formControlName="name" class="w-full rounded-xl border border-slate-200 p-3 outline-none transition focus:ring-2 focus:ring-mayfair-teal dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder-slate-500" placeholder="John Doe" />
      </div>
      <div>
        <label class="mb-2 block text-sm font-bold tracking-tight text-mayfair-navy uppercase dark:text-slate-200">{{ 'form_email' | translate }}</label>
        <input type="email" formControlName="email" class="w-full rounded-xl border border-slate-200 p-3 outline-none transition focus:ring-2 focus:ring-mayfair-teal dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder-slate-500" placeholder="john@company.com" />
      </div>
    </div>

    <div>
      <label class="mb-2 block text-sm font-bold tracking-tight text-mayfair-navy uppercase dark:text-slate-200">{{ 'form_model' | translate }}</label>
      <select formControlName="model" class="w-full rounded-xl border border-slate-200 bg-white p-3 text-slate-600 outline-none transition focus:ring-2 focus:ring-mayfair-teal dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
        <option value="dedicated">{{ 'model_dedicated' | translate }}</option>
        <option value="shared">{{ 'model_shared' | translate }}</option>
        <option value="fixed">{{ 'model_fixed' | translate }}</option>
        <option value="unsure">{{ 'model_unsure' | translate }}</option>
        <option value="career">{{ 'model_career' | translate }}</option>
      </select>
    </div>

    <div>
      <label class="mb-2 block text-sm font-bold tracking-tight text-mayfair-navy uppercase dark:text-slate-200">{{ 'form_message' | translate }}</label>
      <textarea rows="4" formControlName="message" class="w-full rounded-xl border border-slate-200 p-3 outline-none transition focus:ring-2 focus:ring-mayfair-teal dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder-slate-500" [attr.placeholder]="'form_placeholder' | translate"></textarea>
    </div>

    <div class="flex items-center gap-3 rounded-xl border border-slate-100 bg-slate-50 px-4 py-3 dark:border-slate-700 dark:bg-white/5">
      <i class="fab fa-whatsapp text-mayfair-teal"></i>
      <p class="text-xs leading-relaxed text-slate-500 dark:text-slate-400" [innerHTML]="'form_security' | translate"></p>
    </div>

    @if (submitState() === 'error') {
      <p class="text-center text-sm font-semibold text-red-500">{{ 'form_error_message' | translate }}</p>
    }

    <button
      type="submit"
      [disabled]="form.invalid"
      class="flex w-full transform items-center justify-center gap-3 rounded-xl bg-mayfair-navy py-4 text-lg font-bold text-white transition-all hover:-translate-y-1 hover:bg-mayfair-teal hover:shadow-lg disabled:cursor-not-allowed disabled:opacity-60 dark:bg-mayfair-teal dark:hover:bg-white dark:hover:text-mayfair-navy"
    >
      <i class="fab fa-whatsapp text-xl"></i>
      {{ 'form_btn' | translate }}
    </button>
    <p class="text-center text-xs text-slate-400">{{ 'form_footer' | translate }}</p>
  </form>
}
