<app-page-hero
  size="md"
  [badge]="'privacy_hero_badge' | translate"
  [title]="'privacy_hero_title' | translate"
  [subtitle]="'privacy_hero_subtitle' | translate"
/>

<main class="px-6 py-20">
  <div class="mx-auto max-w-4xl">
    @if (translationNote()) {
      <p class="mb-12 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600 dark:border-slate-700 dark:bg-white/5 dark:text-slate-300">
        <i class="fas fa-language mr-2 text-mayfair-teal" aria-hidden="true"></i>{{ translationNote() }}
      </p>
    }

    @for (section of sections; track section.titleKey) {
      <div
        class="mb-16"
        [class]="section.highlighted ? 'rounded-3xl border border-slate-100 bg-slate-50 p-8 dark:border-slate-700 dark:bg-white/5' : ''"
        appReveal
      >
        <div class="mb-4 flex items-center gap-4">
          <div class="text-2xl text-mayfair-teal"><i class="fas" [class]="section.icon" aria-hidden="true"></i></div>
          <h2 class="font-serif text-2xl font-bold text-mayfair-navy dark:text-white">{{ section.titleKey | translate }}</h2>
        </div>
        <p class="leading-relaxed text-slate-600 dark:text-slate-300" [class.mb-4]="section.pointKeys">{{ section.bodyKey | translate }}</p>
        @if (section.pointKeys) {
          <ul class="list-disc space-y-2 pl-6 text-sm text-slate-600 dark:text-slate-300">
            @for (key of section.pointKeys; track key) {
              <li>{{ key | translate }}</li>
            }
          </ul>
        }
      </div>
    }
  </div>
</main>
