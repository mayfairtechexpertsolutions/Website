<app-page-hero
  size="md"
  [badge]="'terms_hero_badge' | translate"
  [title]="'terms_hero_title' | translate"
  [subtitle]="'terms_hero_subtitle' | translate"
/>

<main class="bg-slate-50 px-6 py-16 dark:bg-transparent">
  <article
    appReveal
    class="legal-text mx-auto max-w-4xl rounded-3xl border border-slate-100 bg-white p-8 shadow-sm md:p-12 dark:border-slate-700 dark:bg-slate-900 [&_h3]:mt-8 [&_h3]:mb-4 [&_h3]:font-serif [&_h3]:text-[1.1rem] [&_h3]:font-bold [&_h3]:text-mayfair-navy dark:[&_h3]:text-white [&_li]:mb-4 [&_li]:text-sm [&_li]:leading-relaxed [&_li]:text-slate-600 dark:[&_li]:text-slate-300 [&_p]:mb-4 [&_p]:text-sm [&_p]:leading-relaxed [&_p]:text-slate-600 dark:[&_p]:text-slate-300"
  >
    @if (translationNote()) {
      <p class="mb-8 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600 dark:border-slate-700 dark:bg-white/5 dark:text-slate-300">
        <i class="fas fa-language mr-2 text-mayfair-teal" aria-hidden="true"></i>{{ translationNote() }}
      </p>
    }

    @for (section of sections; track section.titleKey) {
      <section>
        <h3>{{ section.titleKey | translate }}</h3>
        @for (key of section.paragraphKeys; track key) {
          <p [innerHTML]="key | translate"></p>
        }
      </section>
    }
  </article>
</main>
