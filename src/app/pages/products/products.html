<header class="relative overflow-hidden bg-mayfair-navy px-6 py-28 md:py-36">
  <div
    class="absolute inset-0 opacity-10"
    style="background-image: radial-gradient(#20B2AA 0.5px, transparent 0.5px); background-size: 30px 30px;"
  ></div>
  <div class="absolute top-0 right-0 h-full w-1/3 bg-gradient-to-l from-mayfair-teal/10 to-transparent"></div>
  <div class="absolute -bottom-24 -left-24 h-96 w-96 rounded-full bg-mayfair-teal/5 blur-3xl"></div>

  <div class="relative z-10 mx-auto max-w-4xl text-center" appReveal>
    <span
      class="mb-8 inline-block rounded-full border border-mayfair-teal/30 bg-mayfair-teal/5 px-4 py-1.5 text-xs font-bold tracking-[0.3em] text-mayfair-teal uppercase"
    >
      {{ 'products_hero_badge' | translate }}
    </span>
    <h1 class="mb-8 font-serif text-4xl leading-[1.1] font-bold text-white md:text-6xl">
      {{ 'products_hero_title' | translate }}
    </h1>
    <p class="mx-auto max-w-2xl text-lg leading-relaxed text-slate-300 md:text-xl">
      {{ 'products_hero_subtitle' | translate }}
    </p>
  </div>
</header>

<section class="mx-auto max-w-7xl px-6 py-24" appReveal>
  <app-products-grid [fillPlaceholders]="true" />
</section>

<section class="border-t border-mayfair-teal/20 bg-mayfair-navy px-6 py-20 text-white">
  <div class="mx-auto max-w-3xl text-center" appReveal>
    <h2 class="mb-4 font-serif text-3xl font-bold md:text-4xl">{{ 'products_cta_banner_title' | translate }}</h2>
    <p class="mb-8 text-lg text-slate-300">{{ 'products_cta_banner_subtitle' | translate }}</p>
    <a
      routerLink="/"
      fragment="contact"
      class="inline-block rounded-xl bg-mayfair-teal px-10 py-4 text-lg font-bold text-white shadow-xl transition-all hover:bg-white hover:text-mayfair-navy"
    >
      {{ 'products_cta_banner_btn' | translate }}
    </a>
  </div>
</section>
